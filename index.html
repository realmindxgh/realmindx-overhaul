<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta — updated per-page by React -->
    <title>RealMindX Education | Ghana's Educational Services Provider</title>
    <meta name="description"
      content="RealMindX Education Limited offers teacher recruitment, CPD programmes, school transformation, bookshop, tutoring, and more across Ghana." />
    <meta name="keywords"
      content="teacher recruitment Ghana, educational services Ghana, school transformation, tutoring Accra, textbooks Ghana, RealMindX" />
    <meta name="author" content="RealMindX Education Limited" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://realmindxgh.com/" />
    <script>
      if (window.location.hostname.indexOf('bookshop.') === 0) {
        var publicBookshopPaths = ['/track', '/invoice', '/documents', '/categories', '/subjects', '/levels', '/curriculum', '/publishers', '/products'];
        if (publicBookshopPaths.some(function (path) { return window.location.pathname === path || window.location.pathname.indexOf(path + '/') === 0; })) {
          document.querySelector('link[rel="canonical"]').href = window.location.origin + window.location.pathname;
        }
      }
    </script>

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="RealMindX Education" />
    <meta property="og:title"       content="RealMindX Education | Ghana's Educational Services Provider" />
    <meta property="og:description" content="Teacher recruitment, CPD, school transformation, bookshop, tutoring and more across Ghana." />
    <meta property="og:image"       content="https://realmindxgh.com/static/assets/social/realmindx-education-og-1200x630.png?v=20260622" />
    <meta property="og:image:alt"   content="RealMindX Education" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url"         content="https://realmindxgh.com/" />
    <meta property="og:locale"      content="en_GH" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="RealMindX Education | Ghana" />
    <meta name="twitter:description" content="Teacher recruitment, CPD, bookshop, school transformation and more across Ghana." />
    <meta name="twitter:image"       content="https://realmindxgh.com/static/assets/social/realmindx-education-og-1200x630.png?v=20260622" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#143670" />
    <script>
      (function () {
        var path = window.location.pathname;
        var manifest = window.location.hostname.indexOf('bookshop.') === 0
          ? '/bookshop.webmanifest'
          : path.indexOf('/delivery-company') === 0
            ? '/delivery-company.webmanifest'
            : path.indexOf('/delivery') === 0
              ? '/delivery.webmanifest'
              : path.indexOf('/admin') === 0
                ? '/admin.webmanifest'
                : path.indexOf('/staff') === 0
                  ? '/staff.webmanifest'
                  : '';
        if (manifest) {
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = manifest;
          document.head.appendChild(link);
        }
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__rmxInstallPrompt = event;
          window.dispatchEvent(new CustomEvent('rmx:install-ready', { detail: event }));
        });
        window.addEventListener('appinstalled', function () { window.__rmxInstallPrompt = null; });
        if ('serviceWorker' in navigator && (window.isSecureContext || window.location.hostname === 'localhost')) {
          window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
        }
      }());
    </script>
    <script>document.documentElement.classList.add('rmx-js');</script>
    <style>.rmx-js [data-seo-prerendered]{display:none!important}</style>

    <!-- JSON-LD: Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "RealMindX Education Limited",
      "url": "https://realmindxgh.com",
      "logo": "https://realmindxgh.com/logo-white.png",
      "description": "Ghana's most comprehensive educational services provider: teacher recruitment, CPD, school transformation, bookshop, tutoring and more.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Dome Pillar 2",
        "addressLocality": "Accra",
        "addressCountry": "GH"
      },
      "telephone": "+233558039190",
      "email": "info@realmindxgh.com",
      "sameAs": [
        "https://web.facebook.com/profile.php?id=61566941171883",
        "https://www.instagram.com/realmindxgh/"
      ]
    }
    </script>

    <!-- JSON-LD: WebSite (enables Google Sitelinks Searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RealMindX Education",
      "url": "https://realmindxgh.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bookshop.realmindxgh.com/products?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Arimo:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
