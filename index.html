<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Primary meta -->
    <meta name="description" content="RealMindX Education Limited — Ghana's comprehensive educational services provider. Teacher recruitment, CPD, school transformation, bookshop, tutoring, and more." />
    <meta name="keywords" content="teacher recruitment Ghana, educational services Accra, school transformation, tutoring Ghana, textbooks Ghana, RealMindX" />
    <meta name="author" content="RealMindX Education Limited" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://realmindxgh.com/" />
    <title>RealMindX Education | Ghana's Educational Services Provider</title>

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RealMindX Education" />
    <meta property="og:title" content="RealMindX Education | Ghana's Educational Services Provider" />
    <meta property="og:description" content="Teacher recruitment, CPD, school transformation, bookshop, tutoring and more — serving schools, teachers, and families across Ghana." />
    <meta property="og:url" content="https://realmindxgh.com/" />
    <meta property="og:image" content="https://realmindxgh.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GH" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RealMindX Education | Ghana's Educational Services Provider" />
    <meta name="twitter:description" content="Teacher recruitment, CPD, school transformation, bookshop, tutoring and more — serving schools across Ghana." />
    <meta name="twitter:image" content="https://realmindxgh.com/og-image.png" />

    <!-- Favicon & icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#143670" />

    <!-- JSON-LD: Organisation schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "RealMindX Education Limited",
      "url": "https://realmindxgh.com",
      "logo": "https://realmindxgh.com/logo-white.png",
      "description": "Ghana's comprehensive educational services provider — teacher recruitment, professional development, school transformation, bookshop, tutoring, and more.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Dome Pillar 2",
        "addressLocality": "Accra",
        "addressCountry": "GH"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+233-55-803-9190",
        "email": "info@realmindxgh.com",
        "contactType": "customer service"
      },
      "sameAs": [
        "https://web.facebook.com/profile.php?id=61566941171883",
        "https://www.instagram.com/realmindxgh/"
      ]
    }
    </script>

    <!-- JSON-LD: Website / Sitelinks Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RealMindX Education",
      "url": "https://realmindxgh.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://realmindxgh.com/bookshop/products?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Arimo:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
