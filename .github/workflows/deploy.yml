# Repo: https://github.com/realmindxgh/realmindx-overhaul.git
name: Deploy RealMindX to Hostinger VPS

# Runs on every push to main branch, or manually from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A slow release must finish or roll back before another push can deploy.
concurrency:
  group: realmindx-production
  cancel-in-progress: false

jobs:
  security:
    name: Release safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Audit Node dependencies
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit pytest
          python -m pip_audit -r realmindx-site/requirements.txt
          python -m pip install --disable-pip-version-check -r realmindx-site/requirements.txt
          python -m pip check
      - name: Run backend regression suite
        working-directory: realmindx-site
        env:
          DATABASE_URL: sqlite://
          FLASK_ENV: testing
        run: python -m pytest -q

  deploy:
    name: Build & Deploy
    needs: security
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # ── 2. Set up Node 20 ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Build the Vite frontend ────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (production)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: VITE_API_BASE_URL is missing from the production build environment"
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://realmindxgh.com/api*)
              echo "PASS: VITE_API_BASE_URL starts with expected prefix"
              ;;
            *)
              echo "ERROR: VITE_API_BASE_URL does not start with expected prefix"
              exit 1
              ;;
          esac
          echo "Running production Vite build..."
          npm run build

      # ── 4. Copy built frontend into place (we're already on the VPS) ──
      # ── 5. Update backend code, migrate DB, restart services ──────────
      - name: Deploy verified release
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          WHATSAPP_APP_ID: ${{ secrets.WHATSAPP_APP_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_BUSINESS_PHONE_E164: ${{ secrets.WHATSAPP_BUSINESS_PHONE_E164 }}
          WHATSAPP_OTP_TEMPLATE_NAME: ${{ vars.WHATSAPP_OTP_TEMPLATE_NAME }}
          WHATSAPP_OTP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_OTP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_API_VERSION: ${{ vars.WHATSAPP_GRAPH_API_VERSION }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          set -Eeuo pipefail
          LIVE_ROOT="/var/www/realmindx"
          CURRENT_VENV="$LIVE_ROOT/realmindx-site/.venv"
          RELEASE_VENV_ROOT="$LIVE_ROOT/.release-venvs"
          RELEASE_VENV="$RELEASE_VENV_ROOT/$DEPLOY_COMMIT"
          FRONTEND_LIVE="$LIVE_ROOT/dist"
          FRONTEND_RELEASE="$LIVE_ROOT/.dist-release-$DEPLOY_RUN_ID-$DEPLOY_RUN_ATTEMPT"
          FRONTEND_BACKUP="$LIVE_ROOT/.dist-rollback-$DEPLOY_RUN_ID-$DEPLOY_RUN_ATTEMPT"
          ENV_FILE="$LIVE_ROOT/realmindx-site/.env"
          ENV_BACKUP="$LIVE_ROOT/realmindx-site/.env.deploy-backup-$DEPLOY_RUN_ID-$DEPLOY_RUN_ATTEMPT"
          NGINX_SITE="/etc/nginx/sites-available/realmindxgh.com"
          NGINX_BACKUP="$NGINX_SITE.realmindx-backup"
          BOOKSHOP_NGINX_SITE="/etc/nginx/sites-available/bookshop.realmindxgh.com"
          BOOKSHOP_NGINX_BACKUP="$BOOKSHOP_NGINX_SITE.realmindx-backup"
          DELIVERY_NGINX_SITE="/etc/nginx/sites-available/delivery.realmindxgh.com"
          DELIVERY_NGINX_ENABLED="/etc/nginx/sites-enabled/delivery.realmindxgh.com"
          DELIVERY_NGINX_BACKUP="$DELIVERY_NGINX_SITE.realmindx-backup"
          PREVIOUS_COMMIT=""
          PREVIOUS_VENV_TARGET=""
          BACKEND_SWITCHED=0
          CODE_CHECKED_OUT=0
          VENV_MOVED=0
          FRONTEND_SWITCHED=0
          NGINX_CHANGED=0
          BOOKSHOP_NGINX_CHANGED=0
          DELIVERY_NGINX_CHANGED=0

          case "$FRONTEND_RELEASE" in "$LIVE_ROOT"/.dist-release-*) ;; *) exit 1 ;; esac
          case "$FRONTEND_BACKUP" in "$LIVE_ROOT"/.dist-rollback-*) ;; *) exit 1 ;; esac
          case "$RELEASE_VENV" in "$RELEASE_VENV_ROOT"/*) ;; *) exit 1 ;; esac

          wait_for_api() {
            local path="$1"
            local attempts="${2:-30}"
            local count=1
            while [ "$count" -le "$attempts" ]; do
              if curl -fsS --max-time 3 "http://127.0.0.1:5002$path" >/dev/null; then
                return 0
              fi
              sleep 2
              count=$((count + 1))
            done
            return 1
          }

          rollback_release() {
            echo "Deployment validation failed; restoring the previous release."
            if [ "$FRONTEND_SWITCHED" -eq 1 ]; then
              rm -rf -- "$FRONTEND_LIVE"
              if [ -d "$FRONTEND_BACKUP" ]; then mv "$FRONTEND_BACKUP" "$FRONTEND_LIVE"; fi
            fi
            if [ "$NGINX_CHANGED" -eq 1 ] && [ -f "$NGINX_BACKUP" ]; then mv "$NGINX_BACKUP" "$NGINX_SITE"; fi
            if [ "$BOOKSHOP_NGINX_CHANGED" -eq 1 ] && [ -f "$BOOKSHOP_NGINX_BACKUP" ]; then mv "$BOOKSHOP_NGINX_BACKUP" "$BOOKSHOP_NGINX_SITE"; fi
            if [ "$DELIVERY_NGINX_CHANGED" -eq 1 ] && [ -f "$DELIVERY_NGINX_BACKUP" ]; then
              mv "$DELIVERY_NGINX_BACKUP" "$DELIVERY_NGINX_SITE"
              ln -sfn "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_ENABLED"
            elif [ "$DELIVERY_NGINX_CHANGED" -eq 1 ]; then
              rm -f "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_ENABLED"
            fi
            nginx -t && systemctl reload nginx || true
            if [ "$CODE_CHECKED_OUT" -eq 1 ]; then
              cd "$LIVE_ROOT"
              git reset --hard "$PREVIOUS_COMMIT"
            fi
            if [ -f "$ENV_BACKUP" ]; then
              mv "$ENV_BACKUP" "$ENV_FILE"
            fi
            if [ "$BACKEND_SWITCHED" -eq 1 ] || [ "$VENV_MOVED" -eq 1 ]; then
              rm -f "$CURRENT_VENV.next"
              ln -s "$PREVIOUS_VENV_TARGET" "$CURRENT_VENV.next"
              mv -Tf "$CURRENT_VENV.next" "$CURRENT_VENV"
            fi
            if [ "$CODE_CHECKED_OUT" -eq 1 ]; then
              systemctl restart realmindx-api
              wait_for_api "/health" 30 || journalctl -u realmindx-api -n 80 --no-pager
            fi
          }

          on_deploy_error() {
            local exit_code=$?
            trap - ERR
            rollback_release
            rm -rf -- "$FRONTEND_RELEASE"
            exit "$exit_code"
          }
          trap on_deploy_error ERR

          echo "Staging the production frontend"
          rm -rf -- "$FRONTEND_RELEASE" "$FRONTEND_BACKUP"
          mkdir -p "$FRONTEND_RELEASE"
          rsync -a --delete "$GITHUB_WORKSPACE/dist/" "$FRONTEND_RELEASE/"
          test -s "$FRONTEND_RELEASE/index.html"

          echo "Preparing isolated Python dependencies"
          mkdir -p "$RELEASE_VENV_ROOT"
          if [ ! -x "$RELEASE_VENV/bin/python" ]; then
            python3 -m venv "$RELEASE_VENV"
          fi
          "$RELEASE_VENV/bin/python" -m pip install -r "$GITHUB_WORKSPACE/realmindx-site/requirements.txt" -q
          "$RELEASE_VENV/bin/python" -m pip check
          "$RELEASE_VENV/bin/python" -m compileall -q "$GITHUB_WORKSPACE/realmindx-site/backend"

          cd "$LIVE_ROOT"
          PREVIOUS_COMMIT="$(git rev-parse HEAD)"

          echo "── Pulling latest backend code ──"
          git fetch origin main
          git cat-file -e "$DEPLOY_COMMIT^{commit}"
          git reset --hard "$DEPLOY_COMMIT"
          CODE_CHECKED_OUT=1

          echo "── Updating Python dependencies ──"
          "$RELEASE_VENV/bin/python" -m pip check

          echo "── Updating the local GeoIP city database ──"
          GEOIP_MONTH="$(date -u +%Y-%m)"
          GEOIP_DIR="/var/lib/realmindx/geoip"
          GEOIP_FILE="$GEOIP_DIR/dbip-city-lite-$GEOIP_MONTH.mmdb"
          mkdir -p "$GEOIP_DIR"
          if [ ! -s "$GEOIP_FILE" ]; then
            GEOIP_ARCHIVE="$GEOIP_FILE.gz"
            if curl -fsSL "https://download.db-ip.com/free/dbip-city-lite-$GEOIP_MONTH.mmdb.gz" -o "$GEOIP_ARCHIVE.tmp" \
              && gzip -t "$GEOIP_ARCHIVE.tmp" \
              && gzip -dc "$GEOIP_ARCHIVE.tmp" > "$GEOIP_FILE.tmp" \
              && test -s "$GEOIP_FILE.tmp"; then
              mv "$GEOIP_FILE.tmp" "$GEOIP_FILE"
              rm -f "$GEOIP_ARCHIVE.tmp"
            else
              echo "GeoIP download unavailable; keeping the previously installed database."
              rm -f "$GEOIP_ARCHIVE.tmp" "$GEOIP_FILE.tmp"
            fi
          fi
          if [ -s "$GEOIP_FILE" ]; then
            ln -sfn "$(basename "$GEOIP_FILE")" "$GEOIP_DIR/dbip-city-lite.mmdb"
          elif [ ! -s "$GEOIP_DIR/dbip-city-lite.mmdb" ]; then
            echo "No usable GeoIP database is available."
            false
          fi
          ACTIVE_GEOIP_FILE="$(basename "$(readlink -f "$GEOIP_DIR/dbip-city-lite.mmdb")")"
          find "$GEOIP_DIR" -maxdepth 1 -type f -name 'dbip-city-lite-*.mmdb' ! -name "$ACTIVE_GEOIP_FILE" -mtime +70 -delete

          echo "Applying WhatsApp environment settings"
          test -f "$ENV_FILE"
          cp "$ENV_FILE" "$ENV_BACKUP"
          upsert_env_var() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            python3 - "$ENV_FILE" "$key" "$value" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          key = sys.argv[2]
          value = sys.argv[3]
          line = f"{key}={value}"
          text = path.read_text() if path.exists() else ""
          lines = text.splitlines()
          updated = False
          for index, existing in enumerate(lines):
              if existing.startswith(f"{key}="):
                  lines[index] = line
                  updated = True
                  break
          if not updated:
              lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY
          }
          upsert_env_var "FLASK_ENV" "production"
          upsert_env_var "COMMUNICATION_MODE" "live"
          upsert_env_var "WHATSAPP_BUSINESS_PHONE_E164" "$WHATSAPP_BUSINESS_PHONE_E164"
          upsert_env_var "WHATSAPP_PHONE_VERIFICATION_ENABLED" "true"
          upsert_env_var "WHATSAPP_PHONE_VERIFICATION_ALLOW_ALL" "false"
          upsert_env_var "WHATSAPP_PHONE_VERIFICATION_TEST_EMAILS" "skgasante@gmail.com"
          upsert_env_var "WHATSAPP_INBOUND_CHALLENGE_ENABLED" "true"
          upsert_env_var "WHATSAPP_CHALLENGE_PREFIX" "RMX VERIFY"
          upsert_env_var "WHATSAPP_WEBHOOK_VERIFY_TOKEN" "$WHATSAPP_WEBHOOK_VERIFY_TOKEN"
          upsert_env_var "WHATSAPP_APP_ID" "$WHATSAPP_APP_ID"
          upsert_env_var "WHATSAPP_APP_SECRET" "$WHATSAPP_APP_SECRET"
          upsert_env_var "WHATSAPP_ACCESS_TOKEN" "$WHATSAPP_ACCESS_TOKEN"
          upsert_env_var "WHATSAPP_PHONE_NUMBER_ID" "$WHATSAPP_PHONE_NUMBER_ID"
          upsert_env_var "WHATSAPP_BUSINESS_ACCOUNT_ID" "$WHATSAPP_BUSINESS_ACCOUNT_ID"
          upsert_env_var "WHATSAPP_OTP_TEMPLATE_NAME" "$WHATSAPP_OTP_TEMPLATE_NAME"
          upsert_env_var "WHATSAPP_OTP_TEMPLATE_LANGUAGE" "$WHATSAPP_OTP_TEMPLATE_LANGUAGE"
          upsert_env_var "WHATSAPP_GRAPH_API_VERSION" "$WHATSAPP_GRAPH_API_VERSION"
          upsert_env_var "GOOGLE_SITE_VERIFICATION" "$GOOGLE_SITE_VERIFICATION"
          upsert_env_var "BING_SITE_VERIFICATION" "$BING_SITE_VERIFICATION"

          echo "── Running database migrations ──"
          cd realmindx-site
          "$RELEASE_VENV/bin/python" -m compileall -q backend
          "$RELEASE_VENV/bin/python" -c "from backend import create_app; app = create_app(); response = app.test_client().get('/health'); assert response.status_code == 200"
          "$RELEASE_VENV/bin/python" -m flask --app backend:create_app db upgrade heads
          "$RELEASE_VENV/bin/python" -m flask --app backend:create_app seed-permissions
          "$RELEASE_VENV/bin/python" -m flask --app backend:create_app backfill-contacts --apply
          "$RELEASE_VENV/bin/python" scripts/ensure_whatsapp_subscription.py

          echo "── Backfilling optimized product image variants ──"
          "$RELEASE_VENV/bin/python" -m flask --app backend:create_app backfill-product-image-variants --include-drafts
          "$RELEASE_VENV/bin/python" -c "from backend import create_app; app = create_app(); response = app.test_client().get('/health/ready'); assert response.status_code == 200, response.get_json()"
          cd ..

          echo "Switching to the validated Python environment"
          if [ -L "$CURRENT_VENV" ]; then
            PREVIOUS_VENV_TARGET="$(readlink -f "$CURRENT_VENV")"
          elif [ -d "$CURRENT_VENV" ]; then
            PREVIOUS_VENV_TARGET="$RELEASE_VENV_ROOT/legacy-${PREVIOUS_COMMIT:0:12}-$DEPLOY_RUN_ID-$DEPLOY_RUN_ATTEMPT"
            mv "$CURRENT_VENV" "$PREVIOUS_VENV_TARGET"
            VENV_MOVED=1
          else
            echo "The current production virtual environment is missing."
            false
          fi
          test -x "$PREVIOUS_VENV_TARGET/bin/python"
          rm -f "$CURRENT_VENV.next"
          ln -s "$RELEASE_VENV" "$CURRENT_VENV.next"
          mv -Tf "$CURRENT_VENV.next" "$CURRENT_VENV"
          BACKEND_SWITCHED=1
          VENV_MOVED=0

          echo "── Restarting Flask API ──"
          systemctl restart realmindx-api
          if ! wait_for_api "/health/ready" 30; then
            journalctl -u realmindx-api -n 80 --no-pager
            false
          fi

          echo "── Updating managed nginx routes ──"
          NGINX_SITE="/etc/nginx/sites-available/realmindxgh.com"
          if [ ! -f "$NGINX_SITE" ]; then
            echo "Could not locate $NGINX_SITE."
            false
          fi
          NGINX_BACKUP="$NGINX_SITE.realmindx-backup"
          cp "$NGINX_SITE" "$NGINX_BACKUP"
          NGINX_CHANGED=1
          if ! python3 deployment/install_nginx_seo_routes.py "$NGINX_SITE"; then
            mv "$NGINX_BACKUP" "$NGINX_SITE"
            echo "Managed nginx route installer failed; restored the previous configuration."
            false
          fi
          if ! nginx -t; then
            mv "$NGINX_BACKUP" "$NGINX_SITE"
            nginx -t
            echo "Managed nginx route update failed; restored the previous configuration."
            false
          fi

          BOOKSHOP_NGINX_SITE="/etc/nginx/sites-available/bookshop.realmindxgh.com"
          if [ -f "$BOOKSHOP_NGINX_SITE" ]; then
            BOOKSHOP_NGINX_BACKUP="$BOOKSHOP_NGINX_SITE.realmindx-backup"
            cp "$BOOKSHOP_NGINX_SITE" "$BOOKSHOP_NGINX_BACKUP"
            BOOKSHOP_NGINX_CHANGED=1
            if ! python3 deployment/install_nginx_seo_routes.py "$BOOKSHOP_NGINX_SITE"; then
              mv "$BOOKSHOP_NGINX_BACKUP" "$BOOKSHOP_NGINX_SITE"
              echo "Managed bookshop nginx route installer failed; restored the previous configuration."
              false
            fi
            if ! nginx -t; then
              mv "$BOOKSHOP_NGINX_BACKUP" "$BOOKSHOP_NGINX_SITE"
              nginx -t
              echo "Managed bookshop nginx route update failed; restored the previous configuration."
              false
            fi
          else
            echo "Bookshop nginx site file not found at $BOOKSHOP_NGINX_SITE; skipping bookshop SEO route installation."
          fi

          echo "Installing delivery portal nginx site"
          if [ -f "$DELIVERY_NGINX_SITE" ]; then
            cp "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_BACKUP"
          fi
          DELIVERY_NGINX_CHANGED=1
          cp deployment/delivery.realmindxgh.com.conf "$DELIVERY_NGINX_SITE"
          ln -sfn "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_ENABLED"
          if ! nginx -t; then
            if [ -f "$DELIVERY_NGINX_BACKUP" ]; then
              mv "$DELIVERY_NGINX_BACKUP" "$DELIVERY_NGINX_SITE"
            else
              rm -f "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_ENABLED"
            fi
            nginx -t
            echo "Delivery nginx site update failed; restored the previous configuration."
            false
          fi

          echo "── Reloading nginx ──"
          systemctl reload nginx

          echo "Publishing the frontend atomically"
          if [ -d "$FRONTEND_LIVE" ]; then
            mv "$FRONTEND_LIVE" "$FRONTEND_BACKUP"
          fi
          mv "$FRONTEND_RELEASE" "$FRONTEND_LIVE"
          FRONTEND_SWITCHED=1
          wait_for_api "/health/ready" 5

          echo "Running post-deploy SEO and AI-search smoke checks"
          python3 scripts/seo_smoke_check.py --sample-size 12

          rm -rf -- "$FRONTEND_BACKUP"
          rm -f "$NGINX_BACKUP" "$BOOKSHOP_NGINX_BACKUP" "$DELIVERY_NGINX_BACKUP"
          rm -f "$ENV_BACKUP"
          trap - ERR

          echo "✓ Deployment complete"

      - name: Email deployment failure alert
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEO_ALERT_TO: info@realmindxgh.com
          SEO_ALERT_FROM: RealMindX Monitoring <notifications@send.realmindxgh.com>
        run: >-
          python3 scripts/send_workflow_failure_email.py
          --workflow "deployment or post-deployment SEO check"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
