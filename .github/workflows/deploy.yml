# Repo: https://github.com/realmindxgh/realmindx-overhaul.git
name: Deploy RealMindX to Hostinger VPS

# Runs on every push to main branch, or manually from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Node 20 ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Build the Vite frontend ────────────────────────────────────
      #    Production .env values are injected from GitHub Secrets
      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (production)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      # ── 4. Upload built frontend to VPS via rsync ─────────────────────
      - name: Sync built frontend to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.VPS_DEPLOY_PATH }}/dist/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # ── 5. SSH into VPS and complete the deployment ───────────────────
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "── Pulling latest code ──"
            git pull origin main

            echo "── Updating Python dependencies ──"
            realmindx-site/.venv/bin/pip install -r realmindx-site/requirements.txt -q

            echo "── Running database migrations ──"
            cd realmindx-site
            .venv/bin/python -m flask --app backend:create_app db upgrade heads
            cd ..

            echo "── Restarting Flask API ──"
            sudo systemctl restart realmindx-api

            echo "── Reloading nginx ──"
            sudo systemctl reload nginx

            echo "✓ Deployment complete"
