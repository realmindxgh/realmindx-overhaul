# Repo: https://github.com/realmindxgh/realmindx-overhaul.git
name: Deploy RealMindX to Hostinger VPS

# Runs on every push to main branch, or manually from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v6

      # ── 2. Set up Node 20 ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Build the Vite frontend ────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend (production)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      # ── 4. Copy built frontend into place (we're already on the VPS) ──
      - name: Deploy frontend
        run: rsync -avr --delete dist/ /var/www/realmindx/dist/

      # ── 5. Update backend code, migrate DB, restart services ──────────
      - name: Deploy backend & restart
        env:
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          WHATSAPP_APP_ID: ${{ secrets.WHATSAPP_APP_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_OTP_TEMPLATE_NAME: ${{ vars.WHATSAPP_OTP_TEMPLATE_NAME }}
          WHATSAPP_OTP_TEMPLATE_LANGUAGE: ${{ vars.WHATSAPP_OTP_TEMPLATE_LANGUAGE }}
          WHATSAPP_GRAPH_API_VERSION: ${{ vars.WHATSAPP_GRAPH_API_VERSION }}
        run: |
          set -e
          cd /var/www/realmindx

          echo "── Pulling latest backend code ──"
          git fetch origin main
          git reset --hard origin/main

          echo "── Updating Python dependencies ──"
          realmindx-site/.venv/bin/pip install -r realmindx-site/requirements.txt -q

          echo "── Updating the local GeoIP city database ──"
          GEOIP_MONTH="$(date -u +%Y-%m)"
          GEOIP_DIR="/var/lib/realmindx/geoip"
          GEOIP_FILE="$GEOIP_DIR/dbip-city-lite-$GEOIP_MONTH.mmdb"
          mkdir -p "$GEOIP_DIR"
          if [ ! -s "$GEOIP_FILE" ]; then
            GEOIP_ARCHIVE="$GEOIP_FILE.gz"
            if curl -fsSL "https://download.db-ip.com/free/dbip-city-lite-$GEOIP_MONTH.mmdb.gz" -o "$GEOIP_ARCHIVE.tmp" \
              && gzip -t "$GEOIP_ARCHIVE.tmp" \
              && gzip -dc "$GEOIP_ARCHIVE.tmp" > "$GEOIP_FILE.tmp" \
              && test -s "$GEOIP_FILE.tmp"; then
              mv "$GEOIP_FILE.tmp" "$GEOIP_FILE"
              rm -f "$GEOIP_ARCHIVE.tmp"
            else
              echo "GeoIP download unavailable; keeping the previously installed database."
              rm -f "$GEOIP_ARCHIVE.tmp" "$GEOIP_FILE.tmp"
            fi
          fi
          if [ -s "$GEOIP_FILE" ]; then
            ln -sfn "$(basename "$GEOIP_FILE")" "$GEOIP_DIR/dbip-city-lite.mmdb"
          elif [ ! -s "$GEOIP_DIR/dbip-city-lite.mmdb" ]; then
            echo "No usable GeoIP database is available."
            exit 1
          fi
          ACTIVE_GEOIP_FILE="$(basename "$(readlink -f "$GEOIP_DIR/dbip-city-lite.mmdb")")"
          find "$GEOIP_DIR" -maxdepth 1 -type f -name 'dbip-city-lite-*.mmdb' ! -name "$ACTIVE_GEOIP_FILE" -mtime +70 -delete

          echo "Applying WhatsApp environment settings"
          ENV_FILE="/var/www/realmindx/realmindx-site/.env"
          upsert_env_var() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            python3 - "$ENV_FILE" "$key" "$value" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          key = sys.argv[2]
          value = sys.argv[3]
          line = f"{key}={value}"
          text = path.read_text() if path.exists() else ""
          lines = text.splitlines()
          updated = False
          for index, existing in enumerate(lines):
              if existing.startswith(f"{key}="):
                  lines[index] = line
                  updated = True
                  break
          if not updated:
              lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY
          }
          upsert_env_var "WHATSAPP_BUSINESS_PHONE_E164" "+233201166122"
          upsert_env_var "WHATSAPP_PHONE_VERIFICATION_ENABLED" "true"
          upsert_env_var "WHATSAPP_PHONE_VERIFICATION_ALLOW_ALL" "false"
          upsert_env_var "WHATSAPP_PHONE_VERIFICATION_TEST_EMAILS" "skgasante@gmail.com"
          upsert_env_var "WHATSAPP_INBOUND_CHALLENGE_ENABLED" "true"
          upsert_env_var "WHATSAPP_CHALLENGE_PREFIX" "RMX VERIFY"
          upsert_env_var "WHATSAPP_WEBHOOK_VERIFY_TOKEN" "$WHATSAPP_WEBHOOK_VERIFY_TOKEN"
          upsert_env_var "WHATSAPP_APP_ID" "$WHATSAPP_APP_ID"
          upsert_env_var "WHATSAPP_APP_SECRET" "$WHATSAPP_APP_SECRET"
          upsert_env_var "WHATSAPP_ACCESS_TOKEN" "$WHATSAPP_ACCESS_TOKEN"
          upsert_env_var "WHATSAPP_PHONE_NUMBER_ID" "$WHATSAPP_PHONE_NUMBER_ID"
          upsert_env_var "WHATSAPP_BUSINESS_ACCOUNT_ID" "$WHATSAPP_BUSINESS_ACCOUNT_ID"
          upsert_env_var "WHATSAPP_OTP_TEMPLATE_NAME" "$WHATSAPP_OTP_TEMPLATE_NAME"
          upsert_env_var "WHATSAPP_OTP_TEMPLATE_LANGUAGE" "$WHATSAPP_OTP_TEMPLATE_LANGUAGE"
          upsert_env_var "WHATSAPP_GRAPH_API_VERSION" "$WHATSAPP_GRAPH_API_VERSION"

          echo "── Running database migrations ──"
          cd realmindx-site
          .venv/bin/python -m flask --app backend:create_app db upgrade heads
          .venv/bin/python -m flask --app backend:create_app seed-permissions

          echo "── Backfilling optimized product image variants ──"
          .venv/bin/python -m flask --app backend:create_app backfill-product-image-variants --include-drafts
          cd ..

          echo "── Restarting Flask API ──"
          systemctl restart realmindx-api

          echo "── Updating managed nginx routes ──"
          NGINX_SITE="/etc/nginx/sites-available/realmindxgh.com"
          if [ ! -f "$NGINX_SITE" ]; then
            echo "Could not locate $NGINX_SITE."
            exit 1
          fi
          NGINX_BACKUP="$NGINX_SITE.realmindx-backup"
          cp "$NGINX_SITE" "$NGINX_BACKUP"
          if ! python3 deployment/install_nginx_seo_routes.py "$NGINX_SITE"; then
            mv "$NGINX_BACKUP" "$NGINX_SITE"
            echo "Managed nginx route installer failed; restored the previous configuration."
            exit 1
          fi
          if ! nginx -t; then
            mv "$NGINX_BACKUP" "$NGINX_SITE"
            nginx -t
            echo "Managed nginx route update failed; restored the previous configuration."
            exit 1
          fi
          rm -f "$NGINX_BACKUP"

          BOOKSHOP_NGINX_SITE="/etc/nginx/sites-available/bookshop.realmindxgh.com"
          if [ -f "$BOOKSHOP_NGINX_SITE" ]; then
            BOOKSHOP_NGINX_BACKUP="$BOOKSHOP_NGINX_SITE.realmindx-backup"
            cp "$BOOKSHOP_NGINX_SITE" "$BOOKSHOP_NGINX_BACKUP"
            if ! python3 deployment/install_nginx_seo_routes.py "$BOOKSHOP_NGINX_SITE"; then
              mv "$BOOKSHOP_NGINX_BACKUP" "$BOOKSHOP_NGINX_SITE"
              echo "Managed bookshop nginx route installer failed; restored the previous configuration."
              exit 1
            fi
            if ! nginx -t; then
              mv "$BOOKSHOP_NGINX_BACKUP" "$BOOKSHOP_NGINX_SITE"
              nginx -t
              echo "Managed bookshop nginx route update failed; restored the previous configuration."
              exit 1
            fi
            rm -f "$BOOKSHOP_NGINX_BACKUP"
          else
            echo "Bookshop nginx site file not found at $BOOKSHOP_NGINX_SITE; skipping bookshop SEO route installation."
          fi

          echo "Installing delivery portal nginx site"
          DELIVERY_NGINX_SITE="/etc/nginx/sites-available/delivery.realmindxgh.com"
          DELIVERY_NGINX_ENABLED="/etc/nginx/sites-enabled/delivery.realmindxgh.com"
          DELIVERY_NGINX_BACKUP=""
          if [ -f "$DELIVERY_NGINX_SITE" ]; then
            DELIVERY_NGINX_BACKUP="$DELIVERY_NGINX_SITE.realmindx-backup"
            cp "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_BACKUP"
          fi
          cp deployment/delivery.realmindxgh.com.conf "$DELIVERY_NGINX_SITE"
          ln -sfn "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_ENABLED"
          if ! nginx -t; then
            if [ -n "$DELIVERY_NGINX_BACKUP" ]; then
              mv "$DELIVERY_NGINX_BACKUP" "$DELIVERY_NGINX_SITE"
            else
              rm -f "$DELIVERY_NGINX_SITE" "$DELIVERY_NGINX_ENABLED"
            fi
            nginx -t
            echo "Delivery nginx site update failed; restored the previous configuration."
            exit 1
          fi
          if [ -n "$DELIVERY_NGINX_BACKUP" ]; then
            rm -f "$DELIVERY_NGINX_BACKUP"
          fi

          echo "── Reloading nginx ──"
          systemctl reload nginx

          echo "✓ Deployment complete"
