name: Build PDF Rescue 0.9 Forms Signatures Batch

on:
  push:
    branches: [pdf-rescue-release]
    paths:
      - 'pdf-rescue-ci/v09-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Publish 0.9 CI handle
        continue-on-error: true
        shell: pwsh
        run: |
          @"
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          commit=${{ github.sha }}
          state=running
          "@ | Set-Content 'pdf-rescue-ci/v09-build-status.txt'
          git config user.name 'pdf-rescue-ci'
          git config user.email 'pdf-rescue-ci@users.noreply.github.com'
          git add 'pdf-rescue-ci/v09-build-status.txt'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "PDF Rescue 0.9 CI run ${{ github.run_id }} [skip ci]"
            git pull --rebase --autostash
            git push
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Reassemble and verify 0.9 release runner
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem 'pdf-rescue-ci/v09-run-parts/part-*' | Sort-Object Name)
          if ($parts.Count -ne 5) { throw "Expected 5 release-runner parts, found $($parts.Count)." }
          $content = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $content = $content.Replace("`r`n", "`n")
          [IO.File]::WriteAllText('pdf-rescue-ci/v09-run.ps1', $content, [Text.UTF8Encoding]::new($false))
          $expected = 'c7ced11cca331a347cfaaa98c57a94868136afc5b9ed37d6b90c2c9cf6699559'
          $actual = (Get-FileHash 'pdf-rescue-ci/v09-run.ps1' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "0.9 runner SHA mismatch: $actual" }
          Write-Host "PASS: verified 0.9 runner ($actual)."

          $runner = Get-Content 'pdf-rescue-ci/v09-run.ps1' -Raw
          $marker = "Expand-Archive -Path 'v09-overlay.zip' -DestinationPath 'pdf-rescue' -Force"
          if (-not $runner.Contains($marker)) { throw 'Could not locate 0.9 overlay expansion marker for hotfix injection.' }
          $replacement = $marker + "`nCopy-Item 'pdf-rescue-ci/v09-hotfix/BatchPdfService.cs' 'pdf-rescue/src/PdfRescue.App/Services/BatchPdfService.cs' -Force"
          $runner = $runner.Replace($marker, $replacement)
          [IO.File]::WriteAllText('pdf-rescue-ci/v09-run.ps1', $runner, [Text.UTF8Encoding]::new($false))
          Write-Host 'PASS: deterministic 0.9 batch API hotfix injected after sealed overlay.'

      - name: Build test install and launch PDF Rescue 0.9
        shell: pwsh
        run: ./pdf-rescue-ci/v09-run.ps1

      - name: Upload internal launch-proven 0.9 installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Rescue-0.9-Internal-Launch-Proven
          path: pdf-rescue/dist/installer/PDF Rescue Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish final 0.9 CI status
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          @"
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          commit=${{ github.sha }}
          state=${{ job.status }}
          "@ | Set-Content 'pdf-rescue-ci/v09-build-status.txt'
          git config user.name 'pdf-rescue-ci'
          git config user.email 'pdf-rescue-ci@users.noreply.github.com'
          git add 'pdf-rescue-ci/v09-build-status.txt'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "PDF Rescue 0.9 CI ${{ job.status }} ${{ github.run_id }} [skip ci]"
            git pull --rebase --autostash
            git push
          }
