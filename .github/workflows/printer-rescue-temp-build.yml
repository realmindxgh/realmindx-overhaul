name: Printer Rescue Temporary Build

on:
  push:
    branches:
      - printer-rescue-build-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract Printer Rescue source
        shell: pwsh
        run: Expand-Archive -Path printerrescue-build-src.zip -DestinationPath buildsrc -Force
      - name: Publish single-file Windows executable
        shell: pwsh
        run: |
          dotnet publish buildsrc/PrinterRescue-v0.1/src/PrinterRescue.App/PrinterRescue.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish
      - name: Verify executable
        shell: pwsh
        run: |
          Get-ChildItem publish
          if (!(Test-Path publish/PrinterRescue.App.exe)) { throw 'PrinterRescue.App.exe was not produced.' }
          Rename-Item publish/PrinterRescue.App.exe PrinterRescue.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PrinterRescue-win-x64
          path: publish/PrinterRescue.exe
          if-no-files-found: error
          retention-days: 1
