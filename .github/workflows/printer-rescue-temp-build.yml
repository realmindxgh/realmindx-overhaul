name: Printer Rescue Temporary Build

on:
  push:
    branches:
      - printer-rescue-build-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate Printer Rescue branding assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path printerrescue-testbuild/Assets | Out-Null
          Add-Type -AssemblyName System.Drawing

          $size = 256
          $bmp = New-Object System.Drawing.Bitmap($size, $size)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::Transparent)

          function RoundedPath([float]$x,[float]$y,[float]$w,[float]$h,[float]$r) {
            $p = New-Object System.Drawing.Drawing2D.GraphicsPath
            $d = $r * 2
            $p.AddArc($x,$y,$d,$d,180,90)
            $p.AddArc($x+$w-$d,$y,$d,$d,270,90)
            $p.AddArc($x+$w-$d,$y+$h-$d,$d,$d,0,90)
            $p.AddArc($x,$y+$h-$d,$d,$d,90,90)
            $p.CloseFigure()
            return $p
          }

          $bgPath = RoundedPath 9 9 238 238 34
          $p1 = New-Object System.Drawing.Point(20,20)
          $p2 = New-Object System.Drawing.Point(230,240)
          $bgBrush = New-Object System.Drawing.Drawing2D.LinearGradientBrush($p1,$p2,[System.Drawing.Color]::FromArgb(255,17,40,79),[System.Drawing.Color]::FromArgb(255,3,14,35))
          $g.FillPath($bgBrush,$bgPath)
          $edgePen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,41,95,174),2)
          $g.DrawPath($edgePen,$bgPath)

          $haloDark = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,48,92,159),12)
          $haloDark.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $haloDark.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawArc($haloDark,34,31,188,188,143,237)
          $haloGlow = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,27,220,255),13)
          $haloGlow.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $haloGlow.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawArc($haloGlow,34,31,188,188,39,42)

          $outline = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,117,178,255),8)
          $outline.LineJoin = [System.Drawing.Drawing2D.LineJoin]::Round
          $outline.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $outline.EndCap = [System.Drawing.Drawing2D.LineCap]::Round

          $paperPath = New-Object System.Drawing.Drawing2D.GraphicsPath
          $paperPath.AddLine(93,61,153,61)
          $paperPath.AddLine(153,61,177,84)
          $paperPath.AddLine(177,84,177,111)
          $paperPath.AddLine(93,111,93,61)
          $g.DrawPath($outline,$paperPath)
          $foldPen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,82,146,230),5)
          $g.DrawLine($foldPen,153,62,153,84)
          $g.DrawLine($foldPen,153,84,175,84)

          $printerPath = RoundedPath 62 106 132 76 18
          $g.DrawPath($outline,$printerPath)
          $g.DrawLine($outline,82,180,82,199)
          $g.DrawLine($outline,82,199,174,199)
          $g.DrawLine($outline,174,199,174,180)
          $cyan = [System.Drawing.Color]::FromArgb(255,18,222,255)
          $cyanBrush = New-Object System.Drawing.SolidBrush($cyan)
          $blueBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,34,137,248))
          $g.FillEllipse($cyanBrush,166,124,10,10)
          $g.FillEllipse($blueBrush,166,141,9,9)

          $badgeBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,7,28,61))
          $badgePen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(255,104,174,255),6)
          $g.FillEllipse($badgeBrush,90,154,76,76)
          $g.DrawEllipse($badgePen,90,154,76,76)
          $plusPen = New-Object System.Drawing.Pen($cyan,14)
          $plusPen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $plusPen.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawLine($plusPen,128,174,128,210)
          $g.DrawLine($plusPen,110,192,146,192)

          $png = 'printerrescue-testbuild/Assets/PrinterRescue.png'
          $ico = 'printerrescue-testbuild/Assets/PrinterRescue.ico'
          $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
          $hicon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hicon)
          $fs = [System.IO.File]::Open($ico,[System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $icon.Dispose()
          $g.Dispose()
          $bmp.Dispose()

          if (!(Test-Path $png) -or !(Test-Path $ico)) { throw 'Branding assets were not produced.' }

      - name: Integrate logo into application header
        shell: pwsh
        run: |
          $path = 'printerrescue-testbuild/TestApp.cs'
          $src = Get-Content $path -Raw
          $old = 'brand.Children.Add(MakePrinterIcon("Laser", 54));'
          $new = 'var appLogo = new System.Windows.Controls.Image { Width = 58, Height = 58, Stretch = System.Windows.Media.Stretch.Uniform, Source = new System.Windows.Media.Imaging.BitmapImage(new System.Uri("pack://application:,,,/Assets/PrinterRescue.png")) }; brand.Children.Add(appLogo);'
          if (!$src.Contains($old)) { throw 'Could not find header logo placeholder.' }
          $src = $src.Replace($old,$new)
          Set-Content $path $src -Encoding UTF8

      - name: Apply scan busy state and modal settings wiring
        shell: pwsh
        run: |
          $path = 'printerrescue-testbuild/TestApp.cs'
          $src = Get-Content $path -Raw

          $oldFields = 'readonly Button findDriverButton, installInfButton, testPrintButton, copyHwButton;'
          $newFields = @'
readonly Button findDriverButton, installInfButton, testPrintButton, copyHwButton;
    Button? scanButton;
    readonly ProgressBar scanProgress = new() { Height = 3, IsIndeterminate = true, Visibility = Visibility.Collapsed, VerticalAlignment = VerticalAlignment.Bottom };
'@
          if (!$src.Contains($oldFields)) { throw 'Could not find button fields.' }
          $src = $src.Replace($oldFields,$newFields.TrimEnd())

          $oldActions = @'
var scan = Btn("Scan Printers", true); scan.Click += async (_, _) => await Scan();
        var windows = Btn("Windows Printers"); windows.Click += (_,_) => OpenUri("ms-settings:printers");
        var settings = Btn("Settings"); settings.Click += (_,_) => MessageBox.Show("Settings will be expanded after the driver-matching prototype.", "Printer Rescue");
        actions.Children.Add(scan); actions.Children.Add(windows); actions.Children.Add(settings);
'@
          $newActions = @'
scanButton = Btn("Scan Printers", true); scanButton.Click += async (_, _) => await Scan();
        var windows = Btn("Windows Printers"); windows.Click += (_,_) => OpenUri("ms-settings:printers");
        var settings = Btn("Settings"); settings.Click += (_,_) => { var dialog = new SettingsWindow(this); dialog.ShowDialog(); };
        actions.Children.Add(scanButton); actions.Children.Add(windows); actions.Children.Add(settings);
'@
          if (!$src.Contains($oldActions.Trim())) { throw 'Could not find header action block.' }
          $src = $src.Replace($oldActions.Trim(),$newActions.Trim())

          $oldStrip = 'Grid.SetColumn(cat,3); strip.Children.Add(cat);'
          $newStrip = 'Grid.SetColumn(cat,3); strip.Children.Add(cat); Grid.SetColumnSpan(scanProgress,4); strip.Children.Add(scanProgress);'
          if (!$src.Contains($oldStrip)) { throw 'Could not find status strip marker.' }
          $src = $src.Replace($oldStrip,$newStrip)

          $oldScan = @'
async Task Scan()
    {
        foot.Text="Scanning printer queues and Windows PnP devices…";
        try
        {
            var items=await Task.Run(Detect);
            table.ItemsSource=items;
            count.Text=$"{items.Count} print item{(items.Count==1?"":"s")} detected";
            int attentionCount=items.Count(x=>!x.IsVirtual && x.Status!="Installed");
            attention.Text=$"{attentionCount} need attention";
            attention.Foreground=attentionCount==0?Green:Amber;
            scanTime.Text=$"Last scan: {DateTime.Now:h:mm tt}";
            foot.Text=items.Count==0?"No printer queues or PnP printer devices were found.":"Scan complete.";
            if(items.Count>0) table.SelectedIndex=0; else { selected=null; ClearDetail(); }
        }
        catch(Exception ex)
        {
            foot.Text="Scan failed."; MessageBox.Show(ex.Message,"Printer Rescue scan error",MessageBoxButton.OK,MessageBoxImage.Warning);
        }
    }
'@
          $newScan = @'
async Task Scan()
    {
        if (scanButton != null && !scanButton.IsEnabled) return;
        SetScanningState(true);
        foot.Text="Scanning printer queues and Windows PnP devices…";
        scanTime.Text="Scanning…";
        try
        {
            var items=await Task.Run(Detect);
            table.ItemsSource=items;
            count.Text=$"{items.Count} print item{(items.Count==1?"":"s")} detected";
            int attentionCount=items.Count(x=>!x.IsVirtual && x.Status!="Installed");
            attention.Text=$"{attentionCount} need attention";
            attention.Foreground=attentionCount==0?Green:Amber;
            scanTime.Text=$"Last scan: {DateTime.Now:h:mm tt}";
            foot.Text=items.Count==0?"No printer queues or PnP printer devices were found.":"Scan complete.";
            if(items.Count>0) table.SelectedIndex=0; else { selected=null; ClearDetail(); }
        }
        catch(Exception ex)
        {
            scanTime.Text="Scan failed";
            foot.Text="Scan failed."; MessageBox.Show(ex.Message,"Printer Rescue scan error",MessageBoxButton.OK,MessageBoxImage.Warning);
        }
        finally
        {
            SetScanningState(false);
        }
    }

    void SetScanningState(bool scanning)
    {
        scanProgress.Visibility = scanning ? Visibility.Visible : Visibility.Collapsed;
        if (scanButton != null)
        {
            scanButton.IsEnabled = !scanning;
            scanButton.Content = scanning ? "Scanning…" : "Scan Printers";
            scanButton.Cursor = scanning ? System.Windows.Input.Cursors.Wait : System.Windows.Input.Cursors.Hand;
        }
        table.IsEnabled = !scanning;
        if (scanning) Mouse.OverrideCursor = System.Windows.Input.Cursors.Wait;
        else Mouse.OverrideCursor = null;
    }
'@
          if (!$src.Contains($oldScan.Trim())) { throw 'Could not find Scan method.' }
          $src = $src.Replace($oldScan.Trim(),$newScan.Trim())
          Set-Content $path $src -Encoding UTF8

      - name: Publish single-file Windows executable
        shell: pwsh
        run: |
          dotnet publish printerrescue-testbuild/PrinterRescue.Test.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Verify executable
        shell: pwsh
        run: |
          Get-ChildItem publish
          if (!(Test-Path publish/PrinterRescue.exe)) { throw 'PrinterRescue.exe was not produced.' }
          if ((Get-Item publish/PrinterRescue.exe).Length -lt 1000000) { throw 'PrinterRescue.exe looks unexpectedly small.' }

      - uses: actions/upload-artifact@v4
        with:
          name: PrinterRescue-win-x64
          path: publish/PrinterRescue.exe
          if-no-files-found: error
          retention-days: 1
