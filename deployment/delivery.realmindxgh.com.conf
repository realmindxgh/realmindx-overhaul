server {
    listen 80;
    listen [::]:80;
    server_name delivery.realmindxgh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name delivery.realmindxgh.com;

    ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;
    root /var/www/realmindx/dist;
    index index.html;

    location = / { return 302 /manager/login; }
    location = /manager { return 302 /manager/login; }
    location = /rider { return 302 /rider/login; }

    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    location ~ ^/(manager|rider)(/.*)?$ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    location ~ ^/(delivery-company|delivery)\.webmanifest$ {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
        expires -1;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
}
