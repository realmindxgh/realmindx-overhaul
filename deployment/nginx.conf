# /etc/nginx/sites-available/realmindx
# This single config handles:
#   realmindxgh.com          → full RealMindX site (React SPA + Flask API)
#   www.realmindxgh.com      → redirects to realmindxgh.com
#   bookshop.realmindxgh.com → redirects to realmindxgh.com/bookshop
#
# Copy to: /etc/nginx/sites-available/realmindx
# Enable:  sudo ln -s /etc/nginx/sites-available/realmindx /etc/nginx/sites-enabled/realmindx

# ── Redirect www → bare domain ────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.realmindxgh.com;
    ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://realmindxgh.com$request_uri;
}

# ── bookshop subdomain → /bookshop ────────────────────────────────────────────
# When you're ready to use bookshop.realmindxgh.com, just add the DNS A record
# pointing to 72.60.143.104 and uncomment this block. Nothing else changes.
