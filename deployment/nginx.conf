#     include             /etc/letsencrypt/options-ssl-nginx.conf;
#     return 301 https://realmindxgh.com/bookshop$request_uri;
# }

# ── HTTP → HTTPS redirect for main domain ─────────────────────────────────────
server {
    listen 80;
    server_name realmindxgh.com;
    return 301 https://$host$request_uri;
}

# ── Main site ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name realmindxgh.com;

    ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # ── Uploaded files (served directly by nginx, fast) ─────────────────
    location /uploads/ {
        alias /var/www/realmindx/realmindx-site/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

