# /etc/nginx/sites-available/realmindx
# This single config handles:
#   realmindxgh.com          → full RealMindX site (React SPA + Flask API)
#   www.realmindxgh.com      → redirects to realmindxgh.com
#   bookshop.realmindxgh.com → redirects to realmindxgh.com/bookshop
#
# Copy to: /etc/nginx/sites-available/realmindx
# Enable:  sudo ln -s /etc/nginx/sites-available/realmindx /etc/nginx/sites-enabled/realmindx

# ── Redirect www → bare domain ────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.realmindxgh.com;
    ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://realmindxgh.com$request_uri;
}

# ── bookshop subdomain → /bookshop ────────────────────────────────────────────
# When you're ready to use bookshop.realmindxgh.com, just add the DNS A record
# pointing to 72.60.143.104 and uncomment this block. Nothing else changes.
# server {
#     listen 80;
#     listen 443 ssl http2;
#     server_name bookshop.realmindxgh.com;
#     ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
#     include             /etc/letsencrypt/options-ssl-nginx.conf;
#     return 301 https://realmindxgh.com/bookshop$request_uri;
# }

# ── HTTP → HTTPS redirect for main domain ─────────────────────────────────────
server {
    listen 80;
    server_name realmindxgh.com;
    return 301 https://$host$request_uri;
}

# ── Main site ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name realmindxgh.com;

    ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # ── Uploaded files ──────────────────────────────────────────────────
    # Public assets (no auth required) — served directly by nginx for speed.
    location /uploads/public/ {
        alias /var/www/realmindx/realmindx-site/uploads/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Design/seed assets used by public pages — also public.
    location /uploads/Redesign/ {
        alias /var/www/realmindx/realmindx-site/uploads/Redesign/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Protected uploads (documents, private images, etc.) — route through
    # Flask so the auth check in serve_upload() is enforced.  Unauthenticated
    # requests receive a 401 from the app rather than the file content.
    location /uploads/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    # Published article pages receive server-rendered metadata and content so
    # crawlers do not have to infer them from the generic React application shell.
    # BEGIN REALMINDX MANAGED SEO ROUTES
    location = /sitemap.xml {
        proxy_pass         http://127.0.0.1:5002/sitemap.xml;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass         http://127.0.0.1:5002/robots.txt;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/news/[^/]+/?$ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
    # END REALMINDX MANAGED SEO ROUTES

    # ── Flask API ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        client_max_body_size 100M;
    }

    # ── Paystack webhook ─────────────────────────────────────────────────
    location /paystack/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── React SPA ────────────────────────────────────────────────────────
    root /var/www/realmindx/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed bundles are immutable — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Force HTTPS on this host and its subdomains for the next year. Safe to add
    # because the whole site (and the HTTP→HTTPS redirect above) is HTTPS-only;
    # NOT using "preload" since that requires submission to the browser preload
    # list and is effectively irreversible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy — allowlist scoped to the integrations actually
    # used by the site (Paystack checkout, Cloudflare Turnstile, Google Fonts,
    # YouTube/Google Maps embeds). 'unsafe-inline' is kept for script/style
    # because the React build emits inline JSON-LD <script> blocks and
    # element-level style="" attributes — dropping it would need a nonce/hash
    # pipeline in the Vite build. If the browser console reports a CSP
    # violation for a legitimate resource after this ships, widen the matching
    # directive for that exact host rather than relaxing the policy broadly.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.paystack.co https://challenges.cloudflare.com; frame-src 'self' https://checkout.paystack.com https://js.paystack.co https://challenges.cloudflare.com https://www.youtube.com https://www.google.com; form-action 'self' https://checkout.paystack.com; upgrade-insecure-requests" always;
}

