# /etc/nginx/sites-available/realmindx
# This single config handles:
#   realmindxgh.com          → full RealMindX site (React SPA + Flask API)
#   www.realmindxgh.com      → redirects to realmindxgh.com
#   bookshop.realmindxgh.com → redirects to realmindxgh.com/bookshop
#
# Copy to: /etc/nginx/sites-available/realmindx
# Enable:  sudo ln -s /etc/nginx/sites-available/realmindx /etc/nginx/sites-enabled/realmindx

# ── Redirect www → bare domain ────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.realmindxgh.com;
    ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://realmindxgh.com$request_uri;
}

# ── bookshop subdomain → /bookshop ────────────────────────────────────────────
# When you're ready to use bookshop.realmindxgh.com, just add the DNS A record
# pointing to 72.60.143.104 and uncomment this block. Nothing else changes.
# server {
#     listen 80;
#     listen 443 ssl http2;
#     server_name bookshop.realmindxgh.com;
#     ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
#     include             /etc/letsencrypt/options-ssl-nginx.conf;
#     return 301 https://realmindxgh.com/bookshop$request_uri;
# }

# ── HTTP → HTTPS redirect for main domain ─────────────────────────────────────
server {
    listen 80;
    server_name realmindxgh.com;
    return 301 https://$host$request_uri;
}

# ── Main site ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name realmindxgh.com;

    ssl_certificate     /etc/letsencrypt/live/realmindxgh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmindxgh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # ── Uploaded files (served directly by nginx, fast) ─────────────────
    location /uploads/ {
        alias /var/www/realmindx/realmindx-site/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Flask API ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        client_max_body_size 20M;
    }

    # ── Paystack webhook ─────────────────────────────────────────────────
    location /paystack/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── React SPA ────────────────────────────────────────────────────────
    root /var/www/realmindx/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed bundles are immutable — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
